[package]
name = "picket-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "reqwest-blocking"] }
picket-core.workspace = true
picket-model.workspace = true
sha2 = "0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "=2.7.0"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1.28.0", features = ["v4"] }

[lints]
workspace = true
